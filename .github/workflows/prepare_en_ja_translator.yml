name: Prepare offline NLLB translator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare_en_ja_translator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build portable NLLB runtime and model
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'transformers<5' sentencepiece ctranslate2 huggingface_hub safetensors
          mkdir -p bundle/python bundle/model source_model
          python -m pip install --target bundle/python --no-deps 'transformers<5' tokenizers sentencepiece ctranslate2 huggingface_hub safetensors regex filelock fsspec packaging pyyaml requests tqdm
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              'facebook/nllb-200-distilled-600M',
              local_dir='source_model',
              allow_patterns=[
                  'config.json','generation_config.json','pytorch_model.bin','model.safetensors',
                  'sentencepiece.bpe.model','tokenizer.json','tokenizer_config.json',
                  'special_tokens_map.json','added_tokens.json'
              ],
          )
          PY
          ct2-transformers-converter --model source_model --output_dir bundle/model --quantization int8 --force
          cp -f source_model/sentencepiece.bpe.model bundle/model/
          for f in tokenizer.json tokenizer_config.json special_tokens_map.json added_tokens.json generation_config.json; do
            test -f "source_model/$f" && cp -f "source_model/$f" bundle/model/ || true
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path('bundle/model').glob('*')):
              if path.is_file():
                  print(path.name, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          du -sh bundle bundle/model bundle/python
      - name: Upload portable NLLB translator
        uses: actions/upload-artifact@v4
        with:
          name: nllb-600m-int8-portable
          path: bundle
          compression-level: 0
          retention-days: 3
      - name: Publish run ID to metadata branch
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf '%s\n' "$GITHUB_RUN_ID" > translator_run_id.txt
          printf '%s\n' "$GITHUB_SHA" > translator_commit_sha.txt
          git add .
          git commit -m 'Record NLLB translator artifact run'
          git branch -M translator-artifact-metadata
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin translator-artifact-metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
