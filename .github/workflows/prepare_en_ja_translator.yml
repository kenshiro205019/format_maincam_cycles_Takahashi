name: Prepare offline EN-JA translator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build slim portable runtime and download models
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p bundle/python bundle/models
          python -m pip install --target bundle/python --no-deps argostranslate ctranslate2 sacremoses minisbd
          curl -fL --retry 5 --retry-delay 3 'https://data.argosopentech.com/argospm/v1/translate-en_ja-1_1.argosmodel' -o bundle/models/translate-en_ja-1_1.argosmodel
          curl -fL --retry 5 --retry-delay 3 'https://data.argosopentech.com/argospm/v1/translate-ko_en-1_1.argosmodel' -o bundle/models/translate-ko_en-1_1.argosmodel
          curl -fL --retry 5 --retry-delay 3 'https://data.argosopentech.com/argospm/v1/translate-zh_en-1_9.argosmodel' -o bundle/models/translate-zh_en-1_9.argosmodel
          python - <<'PY'
          import os, sys, tempfile
          root = os.path.abspath('bundle')
          sys.path.insert(0, os.path.join(root, 'python'))
          os.environ['XDG_DATA_HOME'] = tempfile.mkdtemp(prefix='argos-test-')
          import argostranslate.package, argostranslate.translate
          for name in ('translate-en_ja-1_1.argosmodel','translate-ko_en-1_1.argosmodel','translate-zh_en-1_9.argosmodel'):
              argostranslate.package.install_from_path(os.path.join(root, 'models', name))
          for text, src in [('A rack and pinion converts linear motion into rotary motion.','en'),('齿条和小齿轮将直线运动转换为旋转运动。','zh'),('랙과 피니언은 직선 운동을 회전 운동으로 변환한다.','ko')]:
              out = argostranslate.translate.translate(text, src, 'ja')
              print(src, out)
              assert out
          PY
          du -sh bundle
      - name: Upload portable translator
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-to-ja-argos-portable-slim
          path: bundle
          compression-level: 0
          retention-days: 2
      - name: Publish run ID to metadata branch
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf '%s\n' "$GITHUB_RUN_ID" > translator_run_id.txt
          printf '%s\n' "$GITHUB_SHA" > translator_commit_sha.txt
          git add .
          git commit -m 'Record translator artifact run'
          git branch -M translator-artifact-metadata
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin translator-artifact-metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
