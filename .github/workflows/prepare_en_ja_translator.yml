name: Prepare offline EN-JA translator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare_en_ja_translator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build portable runtime and download models
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p bundle/python bundle/models
          python -m pip install --target bundle/python --no-deps argostranslate ctranslate2 sacremoses minisbd packaging
          curl -fL --retry 5 --retry-delay 3 'https://data.argosopentech.com/argospm/v1/translate-en_ja-1_1.argosmodel' -o bundle/models/translate-en_ja-1_1.argosmodel
          curl -fL --retry 5 --retry-delay 3 'https://data.argosopentech.com/argospm/v1/translate-zh_en-1_9.argosmodel' -o bundle/models/translate-zh_en-1_9.argosmodel
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path('bundle/models').glob('*.argosmodel')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(path.name, path.stat().st_size, digest)
          PY
          du -sh bundle
      - name: Upload portable translator
        uses: actions/upload-artifact@v4
        with:
          name: en-zh-to-ja-argos-portable
          path: bundle
          compression-level: 0
          retention-days: 3
      - name: Publish run ID to metadata branch
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf '%s\n' "$GITHUB_RUN_ID" > translator_run_id.txt
          printf '%s\n' "$GITHUB_SHA" > translator_commit_sha.txt
          git add .
          git commit -m 'Record translator artifact run'
          git branch -M translator-artifact-metadata
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin translator-artifact-metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
